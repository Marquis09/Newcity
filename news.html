    <style>
        /* ==========================================
           LIVE STATUS INDICATOR EFFECT
           ========================================== */
        .nav-live-indicator {
            width: 8px;
            height: 8px;
            background-color: #ff0000;
            border-radius: 50%;
            margin-left: 6px;
            display: inline-block;
            position: relative;
            box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
            animation: navPulse 1.5s infinite;
        }

        @keyframes navPulse {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 6px rgba(255, 0, 0, 0);
            }
            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 0, 0, 0);
            }
        }

        /* ==========================================
           SCROLL REVEAL ANIMATIONS (SAFETY NET)
           ========================================== */
        .reveal {
            opacity: 0 !important;
            transform: translateY(30px) !important;
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.8s cubic-bezier(0.25, 1, 0.5, 1) !important;
        }
        .reveal.active {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        /* ==========================================
           RESPONSIVE INTERACTIVE OVERRIDES
           ========================================== */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* Base Navigation Structural Overrides */
        .nav-flex {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
        }
        .nav-right {
            display: flex !important;
            align-items: center !important;
            gap: 25px !important;
        }
        .nav-links {
            display: flex !important;
            list-style: none !important;
            gap: 20px !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        /* Screen Breakpoint: Mobile Devices (max-width: 768px) */
        @media (max-width: 768px) {
            .nav-flex {
                flex-direction: column !important;
                gap: 12px !important;
                text-align: center !important;
                padding: 15px 20px !important;
            }
            .nav-right {
                flex-direction: column !important;
                gap: 14px !important;
                width: 100% !important;
                display: flex !important;
            }
            .nav-links {
                display: flex !important;
                justify-content: center !important;
                flex-direction: row !important;
                flex-wrap: wrap !important;
                gap: 25px !important;
                padding: 0 !important;
                margin: 4px 0 !important;
            }
            .nav-links li a {
                display: inline-block !important;
                font-size: 1rem !important;
            }
            .btn-glass {
                width: 100% !important;
                max-width: 320px !important;
                text-align: center !important;
                box-sizing: border-box !important;
                display: block !important;
            }
        }

        /* Chat Pop-up Responsive Adjustments */
        @media (max-width: 400px) {
            .chat-widget {
                width: calc(100% - 30px) !important;
                right: 15px !important;
                bottom: 85px !important;
                height: 450px !important;
            }
        }
        /* NAV WRAPPER */
.nav{
    position:fixed;
    top:0;
    width:100%;
    background:white;
    z-index:999;
}

/* INNER CONTAINER */
.nav-container{
    max-width:1200px;
    margin:auto;
    padding:18px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* LOGO */
.logo{
    font-size:1.3rem;
    font-weight:800;
    text-decoration:none;
    color:#0f172a;
    letter-spacing:-0.5px;
}

.logo span{
    color:#a11f5c;
}

/* LINKS */
.nav-links{
    display:flex;
    list-style:none;
    gap:28px;
}

.nav-links a{
    text-decoration:none;
    font-weight:500;
    color:#0f172a;
    font-size:0.95rem;
    position:relative;
    transition:0.2s ease;
}

/* hover underline effect */
.nav-links a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-6px;
    width:0%;
    height:2px;
    background:#a11f5c;
    transition:0.25s ease;
}

.nav-links a:hover::after{
    width:100%;
}

/* active link */
.nav-links a.active{
    color:#a11f5c;
}

/* BUTTON */
.nav-button{
    padding:12px 20px;
    background:#8b2f5f;
    color:white;
    border-radius:14px;
    text-decoration:none;
    font-weight:600;
    box-shadow:0 10px 25px rgba(139,47,95,0.25);
    transition:0.2s ease;
}

.nav-button:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 35px rgba(139,47,95,0.35);
}
    </style>

<body>

    <header class="news-header">
        <div class="container reveal">
            <span class="badge">Stay Updated</span>

   <div class="chat-trigger" onclick="toggleChat()">

</div>

<div class="chat-widget" id="chatWidget">

        <span>New City Church MK</span>

        </form>
    </div>
</div>

    <footer class="footer-modern">

    <!-- LOGO SECTION WITH YOUR PATHS -->
    <div class="container" style="margin-top: -3rem; display: flex; gap: 2rem; align-items: center; flex-wrap: wrap;">
        <img src="../props/logofooter1.jpg.png" alt="New City Church MK Logo" style="height: 45px; width: auto; opacity: 0.9;">
    </div>
        
    </footer>

   <script>
        function toggleChat() {
            const chat = document.getElementById('chatWidget');
            if (chat.style.display === 'flex') {
                chat.style.display = 'none';
            } else {
                chat.style.display = 'flex';
            }
        }

        function initReveal() {
            const revealElements = document.querySelectorAll(".reveal");
            
            if (!window.IntersectionObserver) {
                revealElements.forEach(el => el.classList.add('active'));
                return;
            }

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("active");
                        observer.unobserve(entry.target); 
                    }
                });
            }, { threshold: 0.05, rootMargin: "0px 0px -20px 0px" });

            revealElements.forEach(element => observer.observe(element));
        }

        function checkChurchLiveStatus() {
            const channelId = "YOUR_CHANNEL_ID_HERE"; 
            const navDot = document.getElementById("nav-live-dot");
            
            if(!channelId || channelId === "YOUR_CHANNEL_ID_HERE") return;

            const liveImgChecker = new Image();
            liveImgChecker.src = `https://img.youtube.com/vi/live_stream/mqdefault.jpg?channel=${channelId}&v=${new Date().getTime()}`;

            liveImgChecker.onload = function() {
                if (this.width === 320) {
                    if(navDot) navDot.style.display = "inline-block";
                } else {
                    if(navDot) navDot.style.display = "none";
                }
            };
            
            liveImgChecker.onerror = function() {
                if(navDot) navDot.style.display = "none";
            };
        }

        // --- NEW DYNAMIC CONTENT ENGINE ---
        async function loadDynamicNewsFeed() {
            const newsGrid = document.getElementById('dynamic-news-grid');
            if (!newsGrid) return;

            // This is a temporary array list so we can test it locally before connecting to GitHub!
            const localTestPosts = [
                {
                    title_slug: "exciting-news-we-are-moving",
                    title: "Exciting News: We are moving!",
                    excerpt: "After five fantastic years of gathering at Monkston Primary School, we are thrilled to announce that starting from 7 September 2025, our...",
                    image: "props/news.png",
                    author: "Richard Wardman",
                    author_img: "props/richard.png",
                    date: "Aug 28, 2025",
                    read_time: "1 min read"
                }
            ];

            newsGrid.innerHTML = ''; // Reset container clear

            localTestPosts.forEach(post => {
                const card = document.createElement('article');
                card.className = 'news-card reveal';
                card.innerHTML = `
                    <div class="news-img">
                        <img src="${post.image}" alt="${post.title}">
                    </div>
                    <div class="news-body">
                        <div class="author-meta">
                            <div class="author-thumb">
                                <img src="${post.author_img}" alt="${post.author}">
                            </div>
                            <div class="author-info">
                                <strong>${post.author}</strong>
                                <span>${post.date} • ${post.read_time}</span>
                            </div>
                        </div>
                        
                        <h2 class="news-title">${post.title}</h2>
                        <p class="news-excerpt">${post.excerpt}</p>
                        
                        <div class="news-cta">
                            <a href="postnews.html?post=${post.title_slug}" class="btn-primary-small">Read Full Article</a>
                        </div>
                        
                        <div class="news-footer">
                            <div class="view-count">
                                <i class="ph ph-eye"></i> Dynamic views
                            </div>
                           
                    </div>
                `;
                newsGrid.appendChild(card);
            });

            // Re-fire our scroll animation lookups for our newly built dynamic elements
            initReveal();
        }
        
        // Execute setups on webpage initiation
        document.addEventListener("DOMContentLoaded", function() {
            loadDynamicNewsFeed();
            initReveal();
            checkChurchLiveStatus();
        });
        // Execute setups on webpage initiation
    document.addEventListener("DOMContentLoaded", function() {
        loadDynamicNewsFeed();
        initReveal();
        checkChurchLiveStatus();

        // Contact Form Email Handler
        const contactForm = document.getElementById('contactForm');
        if (contactForm) {
            contactForm.addEventListener('submit', function(e) {
                e.preventDefault(); 
                const name = document.getElementById('userName').value;
                const email = document.getElementById('userEmail').value;
                const message = document.getElementById('userMessage').value;
                const subject = "New Inquiry from " + name;
                const body = "Name: " + name + "%0AEmail: " + email + "%0A%0AMessage:%0A" + message;
                window.location.href = "mailto:info@newcitychurch.co.uk?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
                contactForm.reset();
            });
        }
    });
    </script>

</body>

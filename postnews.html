<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exciting News: We are moving! | New City MK</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="Styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../props/logonav.png">
    <style>
        /* Update your CSS to this */
.reveal {
    opacity: 1 !important; /* Force everything to be visible */
    transform: translateY(0) !important;
}
      
        .post-footer-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 20px 0;
            border-top: 1px solid #e2e8f0;
            margin-top: 40px;
        }

        .meta-left-group {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .view-count, .like-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            color: #64748b;
        }

        .interactive-like-btn {
            background: none;
            border: none;
            padding: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            border-radius: 50%;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }

        .interactive-like-btn:hover {
            color: #ef4444;
            background: #fef2f2;
            border-color: #fee2e2;
        }

        .interactive-like-btn.liked {
            color: #ef4444;
            background: #fef2f2;
            border-color: #fca5a5;
        }

        .interactive-like-btn.liked i {
            transform: scale(1.15);
        }

        .share-links {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .share-btn {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            color: #475569;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .share-btn:hover {
            background: #f8fafc;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        .share-toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: #0f172a;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 2000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .share-toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: white;
            z-index: 999;
        }

        .nav-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            font-weight: 500;
            color: #0f172a;
            font-size: 0.95rem;
            position: relative;
            transition: 0.2s ease;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 0%;
            height: 2px;
            background: #a11f5c;
            transition: 0.25s ease;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

       /* Keep this for the body text */
#dynamic-post-body {
    display: block !important;
    opacity: 1 !important;
    visibility: visible !important;
}

/* Add this to force the rest of the page to appear */
.reveal {
    opacity: 1 !important;
    transform: translateY(0) !important;
    transition: none !important; /* Disables the animation so it just shows up */
}
#dynamic-location-card {
    display: flex !important; 
    flex-direction: row; /* Or column, depending on your design */
    opacity: 1 !important;
}
    </style>
</head>

<body>

    <nav class="nav">
        <div class="container nav-flex">
            <a href="index.html" class="logo">
                <img src="props/logonav.png" alt="Logo" height="45" style="vertical-align: middle; margin-right: 3px;">
                NEW CITY <span>MK</span>
            </a>

            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="news.html">Back to News</a></li>
                </ul>
            </div>
        </div>
    </nav>

<main class="post-layout">
    <article class="container narrow">

        <!-- AUTHOR + META -->
        <header class="post-header reveal">
            <div class="author-meta">
                <div class="author-thumb">
                    <img id="dynamic-author-img" src="" alt="Author">
                </div>
                <div class="author-info">
                    <strong id="dynamic-author-name"></strong>
                    <span id="dynamic-post-date"></span>
                </div>
            </div>

            <!-- DYNAMIC TITLE -->
            <h1 id="dynamic-post-title"></h1>

            <!-- DYNAMIC EXCERPT -->
            <p class="lead" id="dynamic-post-excerpt"></p>
        </header>

        <!-- MAIN IMAGE + CAPTION -->
        <figure class="post-figure reveal" id="dynamic-post-figure">
            <img id="dynamic-main-img" src="" alt="Cover Image" style="max-width: 100%; height: auto; border-radius: 12px;">
            <figcaption id="dynamic-img-caption"></figcaption>
        </figure>

        <!-- FULL ARTICLE BODY -->
        <div class="post-content reveal">
            <div id="dynamic-post-body"></div>
        </div>

        <!-- VENUE INFORMATION (DYNAMIC) -->
        <div class="location-card reveal" id="dynamic-location-card" style="display: none;">
            <div class="location-text">
                <h3 id="venue-name"></h3>
                <p id="venue-address"></p>
                <p class="w3w">
                    what3words: 
                    <a id="w3w-link" href="#" target="_blank"></a>
                </p>
            </div>
            <a id="dynamic-map-btn" href="#" target="_blank" class="btn-primary">Map to Venue</a>
        </div>

        <!-- FOOTER META (VIEWS + LIKES + SHARE BUTTONS) -->
        <footer class="post-footer-meta reveal">
            <div class="meta-left-group">
                <div class="view-count">
                    <i class="ph ph-eye"></i>
                    <span id="liveViewCounter">0</span> views
                </div>

                <div class="like-wrapper">
                    <button class="interactive-like-btn" id="likeButton" onclick="handleLikeClick()">
                        <i class="ph ph-heart" id="likeIcon"></i>
                    </button>
                    <span id="liveLikeCounter">0</span> likes
                </div>
            </div>

            <!-- SHARE BUTTONS -->
            <div class="share-links">
                <button class="share-btn" onclick="copyLink()" title="Copy Article Link">
                    <i class="ph ph-link"></i>
                </button>
                <button class="share-btn" onclick="share('facebook')" title="Share on Facebook">
                    <i class="ph ph-facebook-logo"></i>
                </button>
                <button class="share-btn" onclick="share('whatsapp')" title="Share on WhatsApp">
                    <i class="ph ph-whatsapp-logo"></i>
                </button>
            </div>
        </footer>

    </article>
</main>


    <footer class="footer-modern">
        <div class="container" style="margin-top: -3rem; display: flex; gap: 2rem; align-items: center; flex-wrap: wrap;">
            <img src="../props/logofooter1.jpg.png" alt="New City Church MK Logo" style="height: 45px; width: auto; opacity: 0.9;">
        </div>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    // 1. UPDATED DATABASE
    const testArticlesDatabase = {
        "exciting-news-we-are-moving": {
            title: "Exciting News: We are moving!",
            author: "Richard Wardman",
            author_img: "props/richard.png",
            date: "Aug 28, 2025 • 1 min read",
            cover_img: "props/oakgrove.png",
            cover_caption: "The theatre at Oakgrove School - our new home for Sundays",
            body: `
                <p>After five fantastic years of gathering at Monkston Primary School, we are thrilled to announce that starting from 7 September 2025, our Sunday meetings will be held at Oakgrove School.</p>
                <p>By God's grace, our church is growing, and we are excited to move to a larger venue with the capacity for further growth.</p>
                <p>For a long time, we've been praying for a venue to accommodate our growing needs, and God has kindly answered us by providing Oakgrove School.</p>
                <p>There is ample space for parking, a brilliant welcome area that's perfect for mingling over coffee, and plenty of space for our growing children's work.</p>
                <p>We're looking forward to welcoming you to our services at Oakgrove School from Sunday 7 September at 10.30am.</p>
            `,
            venue_name: "Oakgrove School",
            venue_address: "Venturer Gate, Milton Keynes, MK10 9JQ",
            w3w_text: "///runs.about.camp",
            w3w_url: "https://what3words.com/runs.about.camp"
        }
    };

   // 3. INTERACTION LOGIC
    function handleLikeClick() {
        const likeCounter = document.getElementById('liveLikeCounter');
        likeCounter.innerText = parseInt(likeCounter.innerText) + 1;
    }

    function copyLink() {
        navigator.clipboard.writeText(window.location.href);
        alert("Link copied!");
    }

    function share(platform) {
        const url = encodeURIComponent(window.location.href);
        if (platform === 'facebook') window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`);
        if (platform === 'whatsapp') window.open(`https://wa.me/?text=${url}`);
    }
    

    document.addEventListener("DOMContentLoaded", loadDynamicArticle);

function loadDynamicArticle() {
    const urlParams = new URLSearchParams(window.location.search);
    const data = testArticlesDatabase[urlParams.get('post')];
    if (!data) return;

    // BASIC CONTENT
    document.getElementById('dynamic-post-title').innerText = data.title;
    document.getElementById('dynamic-post-body').innerHTML = data.body;
    document.getElementById('dynamic-author-name').innerText = data.author;
    document.getElementById('dynamic-author-img').src = data.author_img;
    document.getElementById('dynamic-post-date').innerText = data.date;
    document.getElementById('dynamic-main-img').src = data.cover_img;
    document.getElementById('dynamic-img-caption').innerText = data.cover_caption;

    // VENUE INFO
    const venueName = document.getElementById('venue-name');
    const venueAddress = document.getElementById('venue-address');
    const w3wLink = document.getElementById('w3w-link');
    const mapBtn = document.getElementById('dynamic-map-btn');

    if (venueName) venueName.innerText = data.venue_name;
    if (venueAddress) venueAddress.innerText = data.venue_address;

    if (w3wLink) {
        w3wLink.href = data.w3w_url;
        w3wLink.innerText = data.w3w_text;
    }

    // ⭐ ALWAYS SEND USER TO THIS ADDRESS:
    // Venturer Gate, Milton Keynes MK10 9JQ
    if (mapBtn) {
        mapBtn.href = "https://www.google.com/maps/place/Oakgrove+School/@52.038976,-0.7093625,17z/data=!3m2!4b1!5s0x4877ab3b40d3788f:0x15049be8621a324c!4m6!3m5!1s0x4877ab3d4bf2d52d:0xf0a31df61cc85063!8m2!3d52.038976!4d-0.7093625!16s%2Fm%2F04ydvn2?entry=ttu&g_ep=EgoyMDI2MDcwNS4wIKXMDSoASAFQAw%3D%3D";
    }

    // SHOW VENUE CARD
    const locCard = document.getElementById('dynamic-location-card');
    if (locCard) {
        locCard.style.display = 'flex';
    }
}

document.addEventListener("DOMContentLoaded", loadDynamicArticle);


</script>
</body>
</html>
